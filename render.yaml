# Render Blueprint — must live at the repo root for Render to auto-detect it.
# One web service: the Fastify server builds the client SPA and serves both the
# API and the SPA from the same origin (SERVE_STATIC=true). The World mini-app in
# app/ deploys separately — it is not part of this blueprint.
#
# Secrets come from Infisical (EU) at boot: `npm run start:infisical` wraps the
# server in `infisical run`, which injects everything stored under project HOC
# env=dev folder /mil-fi. The ONLY secret to paste in the Render dashboard is
# INFISICAL_TOKEN — a service token scoped to env=dev, path=/mil-fi (read).
# All other env vars (Mongo, OpenAI, Hedera, World, …) live in Infisical.
services:
  # Production — auto-deploys from `main`.
  - type: web
    name: mil-fi
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: platform            # build/start scripts live in platform/package.json
    buildCommand: npm run build:all
    startCommand: npm run start:infisical
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"

      # ─── Infisical — where the service token goes ────────────────────────
      # Dashboard → mil-fi service → Environment → add INFISICAL_TOKEN with a
      # service token from eu.infisical.com (project HOC → env dev → /mil-fi).
      - key: INFISICAL_TOKEN
        sync: false
      # EU cloud endpoint — the CLI reads this env var automatically.
      - key: INFISICAL_API_URL
        value: https://eu.infisical.com/api
      - key: INFISICAL_PROJECT_ID
        value: 1c02be0d-3fed-4e98-aa38-d02f4eb3a03b
      - key: INFISICAL_ENV
        value: dev
      - key: INFISICAL_SECRET_PATH
        value: /mil-fi

      # ─── Build-time only — Vite bakes VITE_ vars into the client bundle at
      #     `npm run build:all` time, before `infisical run` exists, so they
      #     must stay real Render env vars (runtime copies also sit in
      #     Infisical, same values). ─────────────────────────────────────────
      - key: VITE_WORLD_APP_ID
        value: "app_3e54fa415d153fbd5fd72033452b27f8"
      # staging = verification completes via the simulator link under the QR (no
      # phone needed). Regular World App can't answer World ID 4.0 requests yet
      # (preview) — flip to "production" once World ID 4.0 is GA in World App.
      - key: VITE_WORLD_ENV
        value: "staging"
