services:
  # Production — auto-deploys from `main`. Never push here directly.
  - type: web
    name: hoc-orchestration
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm run build:all
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: MONGODB_DB
        value: milfy-app
      # ─── Secrets ─────────────────────────────────────────────────────────
      # Set directly on the service in the Render dashboard (sync: false).
      # See server/src/config.ts for how they're read.
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RENDER_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # Staging — auto-deploys from `staging`. Default target for AI-authored PRs.
  # Same cluster as prod, isolated by database name.
  #
  # Boot-time behavior on this service (NODE_ENV=production, MONGODB_DB ends in
  # `-staging`): the server calls refreshFromProdIfStaging() before starting
  # Fastify, wiping this DB and copying prod into it. See server/src/lib/refreshDb.ts.
  # Also fires a Telegram boot notification via server/src/lib/telegram.ts.
  - type: web
    name: hoc-orchestration-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: staging
    buildCommand: npm run build:all
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STATIC
        value: "true"
      - key: MONGODB_DB
        value: milfy-app-staging
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RENDER_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
